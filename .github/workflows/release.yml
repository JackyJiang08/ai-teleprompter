name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.1.2

            A small follow-up to [v2.1.1](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.1.1)'s live-microphone fix.

            ---

            ### 🎤 A clear hint when it can't hear your words

            If the app is picking up your voice but recognition produces nothing for a few seconds — almost always because **Speech Recognition** permission was declined while the microphone was allowed, or the on-device English model isn't installed — the status line now says so plainly: *"Not hearing words — check Microphone & Speech Recognition permissions,"* with a one-tap **Settings** button. It clears itself the instant recognition starts working again.

            ### 🧪 The live chain is now a release gate

            The end-to-end live-recognition smoke test (session rotation, real timestamps, voicing edges, first-word recall) added in 2.1.1 now runs on the build machine **before** the app is packaged, so a broken recognition chain can never ship. Plus documentation refreshes and a couple of developer conveniences (`npm run smoke` / `replay` / `fixtures`).

            Everything from [v2.1.1](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.1.1) — no first words lost at pauses, an adaptive silence threshold that adjusts to room noise, and a single microphone capture while tracking — and from [v2.0.0](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.0.0) — the rename with automatic migration and the four AI providers — is unchanged. **Upgrading from 1.x?** First launch still migrates your library automatically and asks for the mic/speech permissions and the AI key again (a one-time in-app notice explains it).

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.1.2_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.1.2_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate the DMG builds on the live-chain smoke test (session rotation, real
  # timestamps, VAD edges, first-word recall). On a headless runner the
  # on-device English dictation model / Speech Recognition grant may be
  # missing; live-smoke.mjs detects that and exits 0 with a SKIP line rather
  # than failing, so the gate blocks only a genuine recognition-chain
  # regression, never an environment limitation.
  smoke:
    name: Live-chain smoke test
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Live smoke test (builds the sidecar; skips if dictation unavailable)
        run: npm run smoke

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
