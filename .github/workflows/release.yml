name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.1.1

            Live-microphone reliability for word tracking.

            v2.1.0's tracking was only ever verified by feeding **audio files** through the recognizer, never a real microphone through the GUI — and a rotation-time bug hid there: while you spoke, the highlight could stall on the first word of each new sentence, or jump to a matching word mid-script and snap back to the start. This release fixes the live chain and adds a smoke test so it can't regress unseen again.

            ---

            ### 🎤 The highlight no longer stalls on the first word

            When the recognizer finalizes a sentence at your pause, there was a brief instant with no active recognition request — and you resume speaking right then, so the **first words of your next sentence** were being dropped, leaving the highlight stuck on word one. Audio is now buffered across that instant and replayed into the next session in order, so nothing is lost. (On the test suite, recall of resumed sentences' opening words rises sharply — fast reads went from confirming the first words of 1 in 7 sentences to the great majority.)

            ### 🎚️ Tracking adapts to your room

            The pause detector no longer uses a single fixed loudness cutoff, which was fragile at real microphone levels and, in a noisy room, never registered silence at all — so sessions never rotated. It now tracks a rolling noise floor and sets its threshold just above it, working the same in a quiet room and over fan or café noise.

            ### 🎙️ One microphone, not two

            While tracking, the app now opens a **single** microphone capture. The "still speaking?" signal that drives coasting comes from the recognition audio itself instead of a second capture that competed with it.

            ### 🏄 Coasting, silence endpointing, and truer fixtures — unchanged from 2.1.0

            The highlight still glides at your reading pace when the recognizer lags (coasting, display-only, toggleable), sessions still rotate on the pauses between sentences, and the regression suite still holds the cursor from ever teleporting and lands it exactly on the last word — now across **30** fixtures including tight-resume and pink-noise variants.

            Everything from [v2.0.0](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.0.0) — the rename with automatic migration, the four AI providers (your Claude or ChatGPT subscription with no API key, an API key, or local Ollama) with model/effort selection, and English-only on-device tracking — is unchanged. **Upgrading from 1.x?** First launch still migrates your library automatically and asks for the mic/speech permissions and the AI key again (a one-time in-app notice explains it).

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.1.1_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.1.1_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
