name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.0.0

            A new name, a sharper focus, and a substantially better tracking engine.

            ---

            ### 🏷️ Renamed, with automatic migration

            Product name, bundle identifier, and repository are all renamed **AI Teleprompter** (old repository URLs redirect). Because the bundle identifier changed, macOS treats 2.0 as a new app — so on first launch it migrates the previous install's data automatically (**copied, never moved or deleted**, and only once). Two things macOS cannot carry across an identity change, explained by a one-time in-app notice:

            - **AI provider API key** — re-enter it in Settings → Prepare with AI (it lives only in the macOS Keychain).
            - **Microphone & Speech Recognition permissions** — macOS asks again on your first reading session.

            ### 🎯 Sequence-coherent word tracking

            Word tracking was rebuilt so a stray common word can no longer teleport the cursor into the wrong sentence:

            - The sidecar now streams **per-word data** (each word's timing and confidence), and every recognition request is biased toward your script's **vocabulary** (`contextualStrings`) on top of the customized language model — plus an optional **Tricky words** list in Settings for proper nouns and pronunciations.
            - The matcher aligns whole phrases: **stopwords can't trigger a jump**, a jump needs a **two-word anchor**, the cursor commits only **stable** words and can **correct itself** within a bounded window, and numbers/percentages/acronyms are matched in spoken form (`23%` ↔ "twenty three percent", `UIUC` ↔ "u i u c").
            - Tuned and regression-tested against a suite of **synthesized-voice fixtures** (macOS text-to-speech run back through the real recognizer — three voices, two rates, plus fillers/repeats/skips/restart/silence). Across all of them the cursor never teleports to the wrong sentence and ends within a couple of words of the true end.

            ### 🤖 Four ways to Prepare with AI

            ✦ Prepare now works with **your existing Claude or ChatGPT subscription — no API key** — by delegating to the official Claude Code and OpenAI Codex CLIs you've already signed into (the app never touches your credentials). An Anthropic API key and a local Ollama server are still there too. Pick a **model** and an **effort** level (Low / Medium / High / Extra high) per provider, with live Available / Not installed / Not logged in detection in Settings.

            ### 🇺🇸 English-only scope

            Word tracking always runs the on-device `en-US` recognizer; the language selector is gone.

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.0.0_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.0.0_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
