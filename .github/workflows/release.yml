name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.1.0

            Word-tracking refinements on top of the v2.0.0 engine.

            ---

            ### 🏄 Coasting — the highlight never freezes mid-phrase

            The recognizer lags your voice by a moment, and on a hard phrase it can go quiet for a second or more. Coasting keeps the highlight gliding forward at your reading pace during those lags — capped a few words ahead — then eases back to the exact word the instant recognition catches up. A coasted word shows the accent highlight without the underline. It's **display only** (it never changes where tracking has confirmed), on by default, and toggleable in Settings. On the test suite the worst display freeze drops from 4.2 s to 2.1 s.

            ### 🎯 Truer tracking, tested against real recognition

            - The speech sidecar now rotates recognition sessions on its own **silence endpointing**, at the pauses between sentences — the way a live reader speaks — which keeps each session short and its timestamps real, and prevents transcript truncation on long readings.
            - The regression suite (macOS text-to-speech read back through the real recognizer — three voices, two rates, plus fillers, repeats, skips, a restart, and silences) is regenerated as one continuous feed per script, so it matches live use. Across all 24 fixtures the cursor never teleports and ends **exactly** on the last word; a new **line-completion** rule commits a line's last dropped words at its closing pause so the next sentence starts clean.

            ### 📝 Consistency

            The README's word-tracking description was corrected — the cursor self-corrects within a small bounded window rather than "never jumping backward" — and documents coasting.

            Everything from [v2.0.0](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.0.0) — the rename with automatic migration, the four AI providers (your Claude or ChatGPT subscription with no API key, an API key, or local Ollama) with model/effort selection, and English-only on-device tracking — is unchanged. **Upgrading from 1.x?** First launch still migrates your library automatically and asks for the mic/speech permissions and the AI key again (a one-time in-app notice explains it).

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.1.0_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.1.0_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
