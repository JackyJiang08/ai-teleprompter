name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.0.0

            The app has a new name — **AI Teleprompter** — and a sharper focus: English-only, on-device word tracking plus AI script preparation.

            ---

            ### 🏷️ Renamed

            Product name, bundle identifier, and repository are all renamed (the repository's old URLs redirect). Everything else about the app — the notch pill, word tracking, ✦ Prepare, the script library — works exactly as in [v1.1.0](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v1.1.0).

            ### 🔁 Automatic migration from 1.x

            Because the bundle identifier changed, macOS treats 2.0 as a brand-new app. On first launch the app migrates the previous install's data automatically — everything is **copied, never moved or deleted**, and only once. Two things macOS cannot carry across an identity change, and a one-time in-app notice explains both:

            - **AI provider API key** — re-enter it in Settings → Prepare with AI (it lives only in the macOS Keychain).
            - **Microphone & Speech Recognition permissions** — macOS asks for them again on your first reading session.

            ### 🇺🇸 English-only scope

            Word tracking now always runs the on-device `en-US` recognizer, and the language selector is gone from Settings. The tokenizer and matcher work on whitespace-delimited words, which simplifies the whole tracking pipeline.

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.0.0_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.0.0_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
