name: Release

# Maintenance notes:
# - The release body below is written per-release; update it before tagging
#   a new version (it is the canonical release-notes draft).
# - Asset naming caveat: DMG names derive from tauri.conf.json productName
#   ("AI Teleprompter"); GitHub replaces spaces with dots in uploaded asset
#   filenames (AI.Teleprompter_x.y.z_arch.dmg). Do NOT rename the product
#   to "fix" this — the app is published under this name. If predictable
#   asset names ever matter, rename the files in a build step before
#   upload instead.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} — AI Teleprompter
          draft: true
          prerelease: false
          body: |
            ## AI Teleprompter v2.1.4

            Honest screen-sharing behavior — and a reliable way to go dark.

            ---

            ### ⚠️ Correction: the app is not auto-hidden from Zoom on macOS 15.4+

            Earlier releases said the prompter was invisible to Zoom, Meet, Loom, and recordings. That is **no longer true**. As of **macOS 15.4**, Apple changed the system so a window's content-protection flag (`sharingType = none`) no longer excludes it from ScreenCaptureKit capture, and Apple states there is **no public API to prevent screen capture** ([Apple Developer Forums](https://developer.apple.com/forums/thread/787527), [Tauri #14200](https://github.com/tauri-apps/tauri/issues/14200)). Zoom captures the raw display by default, so a **whole-screen share shows the panel and your script text**. The flag still hides the app from **local screenshots and legacy capture**, so it's kept — but it is not a guarantee, and all "invisible to Zoom" wording has been removed.

            ### 🕶️ New: Sharing mode — go dark instantly with ⌘⇧H

            Press **⌘⇧H** (or the pill's "go dark" control) to **hide every window and pause tracking** the moment a screen share starts. A dot appears in the menu-bar icon while you're hidden; press ⌘⇧H again — or click the menu-bar icon — to bring the prompter back.

            **Sharing safely** (now in the README): share a *window* instead of the whole desktop; share the *other* display and keep the prompter on your built-in screen; or, in Zoom, enable "Advanced capture with window filtering" and share a specific window. Camera-only recordings (video calls, interview recorders, self-recorded video) never see the app.

            On a notch display the physical notch cutout is always a black bar in any screen share — that's macOS drawing the notch for every app.

            Everything else from [v2.1.3](https://github.com/JackyJiang08/ai-teleprompter/releases/tag/v2.1.3) and earlier — the live-microphone fixes, coasting, the four AI providers, and automatic migration — is unchanged. **Upgrading from 1.x?** First launch still migrates your library automatically and asks for the mic/speech permissions and the AI key again (a one-time in-app notice explains it).

            ---

            ### 📦 Downloads — macOS only

            | Platform | File | Notes |
            |---|---|---|
            | 🍎 Apple Silicon (M1–M4) | `AI Teleprompter_2.1.4_aarch64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |
            | 🍎 Intel Mac | `AI Teleprompter_2.1.4_x64.dmg` | macOS 13+ (script-biased recognition needs macOS 14+) |

            ### ⚠️ First launch

            The app isn't signed with an Apple Developer certificate, so macOS will claim it's "damaged". It isn't — remove the quarantine flag once:

            ```bash
            xattr -cr "/Applications/AI Teleprompter.app"
            ```

            On first read, macOS will ask for **Microphone** and **Speech Recognition** permissions — both are used entirely on-device.

            ---

            Free and open source (MIT). Based on openTeleprompt by ArunNGun — see [NOTICE](https://github.com/JackyJiang08/ai-teleprompter/blob/main/NOTICE) for provenance.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gate the DMG builds on the live-chain smoke test (session rotation, real
  # timestamps, VAD edges, first-word recall). On a headless runner the
  # on-device English dictation model / Speech Recognition grant may be
  # missing; live-smoke.mjs detects that and exits 0 with a SKIP line rather
  # than failing, so the gate blocks only a genuine recognition-chain
  # regression, never an environment limitation.
  smoke:
    name: Live-chain smoke test
    runs-on: macos-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Live smoke test (builds the sidecar; skips if dictation unavailable)
        run: npm run smoke

  build-mac-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target aarch64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    needs: smoke
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install

      - name: Build
        run: npx @tauri-apps/cli build --target x86_64-apple-darwin

      - name: Upload DMG
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
