[package]
name = "ai-teleprompter"
version = "2.1.2"
description = "AI Teleprompter — voice-tracking teleprompter"
authors = ["Yuqing (Jacky) Jiang", "Arun Kumar (upstream openTeleprompt)"]
edition = "2021"

[lib]
name = "ai_teleprompter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-teleprompter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "devtools", "image-png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSPanel", "NSScreen", "NSRunningApplication", "NSApplication", "NSAlert"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSGeometry"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
open = "5"
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
panic = "abort"
codegen-units = 1
opt-level = "s"
lto = true
strip = true
